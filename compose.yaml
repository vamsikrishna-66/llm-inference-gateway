services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [ollama, redis]
  redis:
    image: redis:7.4-alpine
  ollama:
    image: ollama/ollama:0.6.8
    volumes:
      - models:/root/.ollama
volumes:
  models:
